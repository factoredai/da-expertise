[pytest]
# Run `pytest` with no arguments from the repo root to validate the marketplace.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    marketplace: validates the top-level .claude-plugin/marketplace.json catalog
    plugin: validates a plugin manifest (plugins/<id>/.claude-plugin/plugin.json)
    skill: validates a skill definition (plugins/<id>/skills/<name>/SKILL.md)
